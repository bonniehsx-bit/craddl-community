; ==================================================
; JxMall Supervisor 配置文件模板
; 自动生成时间: __DATE__
; ==================================================

[program:__GO_PROGRAM_NAME__]
; 启动命令: 自动指向项目目录下的二进制文件和配置文件
command=__PROJECT_ROOT__/__GO_BINARY_NAME__ -config __PROJECT_ROOT__/scheduler.yaml

; 工作目录
directory=__PROJECT_ROOT__/

; 运行用户 (宝塔/Web环境通常是 www)
user=__RUN_USER__

; 自动重启设置
autorestart=true
startsecs=3
startretries=3

; 优先级
priority=999
numprocs=1
process_name=%(program_name)s_%(process_num)02d

; --- 日志配置 ---
; 建议将日志放在项目目录下，方便脚本统一管理权限
stdout_logfile=__PROJECT_ROOT__/runtime/logs/scheduler.out.log
stderr_logfile=__PROJECT_ROOT__/runtime/logs/scheduler.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; 环境变量 (生产环境建议设为 release)
environment=GIN_MODE=release